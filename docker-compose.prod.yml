version: "3.9"

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-droptix}
      DB_USER: ${DB_USER:-droptix_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-droptix}
      POSTGRES_USER: ${DB_USER:-droptix_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-droptix_user} -d ${DB_NAME:-droptix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_backup:
    image: postgres:16-alpine
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-droptix}
      DB_USER: ${DB_USER:-droptix_user}
      DB_PASSWORD: ${DB_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backend/scripts/backup-db.sh:/backup-db.sh:ro
      - backups_data:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: |
      sh -c '
        chmod +x /backup-db.sh
        echo "0 2 * * * /backup-db.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        echo "Scheduled database backups at 02:00 AM daily."
        /backup-db.sh
        crond -f -l 2
      '

volumes:
  pgdata:
  uploads_data:
  backups_data:
  caddy_data:
  caddy_config:
